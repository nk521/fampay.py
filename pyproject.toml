[project]
name = "fampay_py"
version = "26.02.003"
description = "Reverse engineered API client for FamPay TPAP"
authors = [
    {name = "Nikhil",email = "nk_mason@protonmail.com"},
]
dependencies = ["httpx~=0.28.1", "pycryptodomex~=3.24.0"]
requires-python = "==3.14.*"
readme = "README.md"
license = {text = "GPL-3.0-only"}


[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "black>=26.10.0",
]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.isort]
profile = "black"
multi_line_output = 3
force_grid_wrap = 2

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.pdm]
distribution = false
